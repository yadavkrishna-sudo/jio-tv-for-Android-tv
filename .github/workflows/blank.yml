name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only for publishing a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Works whether the project is at the repo root or inside a subfolder (e.g. OpenLiveTV/).
      - name: Locate Gradle project
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts -not -path '*/build/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "::error::No settings.gradle.kts found anywhere in the repo. Did the project files get pushed?"
            echo "Repo contents:"; find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Found Gradle project in: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # No Gradle wrapper jar in the repo, so install Gradle 8.9 directly.
      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$HOME"
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      # Release build is minified with R8; signed with the debug key (see app/build.gradle.kts)
      # so it can still be sideloaded. Non-blocking so a shrinker issue never hides the debug APK.
      - name: Build release APK
        continue-on-error: true
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: OpenLiveTV-debug
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: OpenLiveTV-release
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            $(find "${{ steps.proj.outputs.dir }}/app/build/outputs/apk" -name '*.apk') \
            --generate-notes
